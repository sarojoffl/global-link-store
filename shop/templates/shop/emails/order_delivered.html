<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .wrapper { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 6px; overflow: hidden; }
    .header { background: #111827; padding: 24px 32px; }
    .header h1 { color: #ffffff; margin: 0; font-size: 20px; }
    .body { padding: 32px; color: #374151; line-height: 1.6; }
    .footer { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 20px 32px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header"><h1>Order Delivered</h1></div>
    <div class="body">
      <p>Hi {{ order.shipping_name }},</p>
      <p>Your order <strong>{{ order.order_number }}</strong> has been marked as delivered.</p>
      <p>Thank you for shopping with Global Link Store. If anything is wrong with your order, contact us as soon as possible.</p>
    </div>
    <div class="footer">&copy; {% now "Y" %} Global Link Store</div>
  </div>
</body>
</html>
